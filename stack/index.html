<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #1e1728;
    --surface:     #261d33;
    --bronze:      #b8935a;
    --bronze-dim:#7a5e35;
    --bronze-glow: rgba(184,147,90,0.15);
    --text-dim:    #9b8fb0;
    --red:         #c0392b;
    --white:       #f0ece6;
    --muted:       #6b5f7a;
    --radius:      10px;
    --panel-r:     20px;
  }

  html, body {
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button, input { font-family: inherit; }

  /* Whole page lives in one centred mobile-width column (site-wide pattern) */
  .page {
    max-width: 520px;
    margin: 0 auto;
    padding-bottom: calc(2rem + env(safe-area-inset-bottom));
  }

  /* ══ HEADER — standard index-page pattern (header-pattern.md) ══════ */
  .tk-header { text-align: center; padding: 0.25rem 1.5rem 0; }

  .logo-wrap {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    margin-bottom: 1.6rem; /* clears the absolute HOME label + breathes before content */
  }

  .logo-pip-ring { width: 48px; height: 48px; flex-shrink: 0; }

  /* Both pip-rings are clickable home links */
  .logo-home {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    padding: 6px;
    margin: -6px;
    text-decoration: none;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .logo-home:hover, .logo-home:active { background: var(--bronze-glow); }
  button.logo-home { background: none; border: 0; font: inherit; cursor: pointer; }
  .logo-home:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
  .logo-home .logo-pip-ring { display: block; }

  /* "HOME" floats beneath each ring — absolute so it adds no row height */
  .logo-home-label {
    position: absolute;
    top: calc(100% - 5px);
    left: calc(50% + 2px);
    transform: translateX(-50%);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-dim);
    line-height: 1;
    pointer-events: none;
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    /* "STACK IT UP" fits the pip-ring row at the homepage's native size;
       nowrap keeps the two spaces from wrapping the title to a second line. */
    font-size: clamp(2.4rem, 14vw, 3.6rem);
    letter-spacing: 0.04em;
    color: var(--bronze);
    line-height: 1;
    text-transform: uppercase;
    white-space: nowrap;
  }

  @media (min-width: 640px) {
    .logo-wrap { gap: 0.9rem; }
    .logo-pip-ring { width: 60px; height: 60px; }
    h1 { font-size: clamp(2.8rem, 16vw, 4.2rem); }
  }

  .tagline {
    font-size: 1.2rem;
    color: var(--text-dim);
    margin-top: -0.85rem;
    letter-spacing: 0.01em;
  }

  /* ══ PINNED / QUICK REFERENCE — concept tiles above the search ════ */
  .pinned { margin-top: 2.6rem; padding: 0 1.25rem 0.5rem; }

  /* Anchor row — The Stack, inset narrower than the phase row below it.
     margin-top clears the anchor's medallion, which pokes ~38px above
     the tile's own top border (see .pin-anchor .pin-icon transform). */
  .pin-stack-row { display: flex; justify-content: center; margin-top: 2.2rem; }
  .pin-anchor {
    width: calc(100% - 2.6rem);
    max-width: 420px;
    padding: 2.5rem 1.25rem 1.4rem;
  }

  /* Two phases, equal width, full pinned width. margin-top clears the
     phase medallions (~30px protrusion) from the anchor tile above. */
  .pin-phase-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.7rem;
    margin-top: 2.4rem;
  }
  .pin-phase-row .pin-tile { padding: 2.1rem 0.75rem 1.1rem; }

  /* Sigil-break tile: the icon escapes the box into a medallion that
     straddles the top edge, so the card reads as a plaque hung under
     its sigil rather than an icon centered in a plain rect. */
  .pin-tile {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    background: var(--surface);
    border: 1.5px solid var(--bronze-dim);
    border-radius: 6px;
    text-decoration: none;
    text-align: center;
    overflow: visible;
    /* faint always-on top bevel so the surface isn't dead flat */
    box-shadow: inset 0 1px 0 rgba(240,236,230,0.045);
    transition: border-color 0.18s, transform 0.15s, box-shadow 0.18s;
  }
  /* bronze-glow fill layer fades in on hover */
  .pin-tile::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 6px;
    background: var(--bronze-glow);
    opacity: 0;
    transition: opacity 0.18s;
    pointer-events: none;
  }
  .pin-tile:hover, .pin-tile:active {
    border-color: var(--bronze);
    transform: translateY(-2px);
    box-shadow: inset 0 1px 0 rgba(240,236,230,0.07),
                0 10px 24px -16px rgba(0,0,0,0.95);
  }
  .pin-tile:hover::after, .pin-tile:active::after { opacity: 1; }

  .pin-icon {
    position: absolute;
    top: 0;
    left: 50%;
    color: var(--bronze);
    line-height: 1;
    background: var(--bg);
    border: 2px solid var(--bronze);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    transition: box-shadow 0.18s;
  }
  .pin-tile:hover .pin-icon, .pin-tile:active .pin-icon {
    box-shadow: 0 0 14px rgba(184,147,90,0.4);
  }
  .pin-icon svg { display: block; }
  .pin-anchor .pin-icon {
    width: 4rem; height: 4rem;
    transform: translate(-50%, -60%);
  }
  .pin-anchor .pin-icon svg { width: 28px; height: 28px; }
  .pin-anchor .pin-icon img { height: 32px; width: auto; display: block; }
  .pin-phase-row .pin-icon {
    width: 3.2rem; height: 3.2rem;
    transform: translate(-50%, -58%);
  }
  .pin-phase-row .pin-icon svg { width: 22px; height: 22px; }
  .pin-phase-row .pin-icon img { height: 24px; width: auto; display: block; }

  .pin-label {
    position: relative;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--bronze);
    line-height: 0.95;
    letter-spacing: 0.03em;
  }
  .pin-anchor .pin-label { font-size: 1.6rem; letter-spacing: 0.05em; }
  .pin-phase-row .pin-label { font-size: 1.28rem; }

  /* ══ STICKY CONTROLS — search only (no tier toggle) ══════════════ */
  .controls {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    padding: 0.85rem 1.25rem 0.7rem;
    border-bottom: 1px solid rgba(122,94,53,0.35);
    box-shadow: 0 8px 18px -14px rgba(0,0,0,0.9);
  }

  .search-wrap { position: relative; display: flex; align-items: center; }
  .search-icon {
    position: absolute;
    left: 14px;
    width: 18px;
    height: 18px;
    color: var(--text-dim);
    pointer-events: none;
  }
  .search-icon svg { width: 100%; height: 100%; display: block; }

  #search {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--bronze-dim);
    border-radius: 12px;
    color: var(--white);
    /* 16px keeps iOS from auto-zooming the field on focus */
    font-size: 16px;
    padding: 0.7rem 2.6rem 0.7rem 2.6rem;
    transition: border-color 0.2s, background 0.2s;
  }
  #search::placeholder { color: var(--text-dim); }
  #search:focus { outline: none; border-color: var(--bronze); background: #2c2240; }
  /* Strip the native search clear so ours is the only one */
  #search::-webkit-search-decoration,
  #search::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }

  .clear-btn {
    position: absolute;
    right: 8px;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    border-radius: 50%;
    color: var(--text-dim);
    cursor: pointer;
    transition: color 0.15s, background 0.15s;
  }
  .clear-btn:hover { color: var(--white); background: var(--bronze-glow); }
  .clear-btn svg { width: 16px; height: 16px; }
  .clear-btn[hidden] { display: none; }

  /* ── Category filter chips — sit under the search field ── */
  .filters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.4rem;
    margin-top: 0.6rem;
  }
  /* Pill shape kept as-is; the edge (not the fill) carries category
     identity, and it's thick enough to read as the chip's main color cue. */
  .filter-chip {
    display: inline-flex;
    align-items: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--white);
    background: var(--surface);
    border: 3px solid var(--chip, var(--bronze-dim));
    border-radius: 999px;
    padding: 0.28rem 0.75rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
  }
  .filter-chip:hover { background: var(--bronze-glow); }
  .filter-chip.active {
    color: var(--bg);
    background: var(--chip, var(--bronze));
    transform: translateY(-1px);
    box-shadow: 0 6px 14px -8px rgba(0,0,0,0.8);
  }

  /* No-match panel — drops in under the controls (an invitation, not an error) */
  .suggest-panel {
    margin-top: 0.7rem;
    background: var(--surface);
    border: 1px solid var(--bronze-dim);
    border-radius: 14px;
    padding: 0.9rem 1rem;
    text-align: center;
  }
  .suggest-panel[hidden] { display: none; }
  .suggest-panel p {
    color: var(--text-dim);
    font-size: 0.95rem;
    margin-bottom: 0.65rem;
  }
  .suggest-panel .q { color: var(--white); font-weight: 600; }
  .suggest-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--bronze);
    color: var(--bg);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 0.55rem 1.1rem;
    border-radius: 10px;
    transition: filter 0.15s, transform 0.15s;
  }
  .suggest-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }

  /* Tiny note for a genuinely empty bucket (no query) */
  .empty-note {
    margin: 2.5rem 1.25rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .empty-note[hidden] { display: none; }

  /* ══ ENTRY GRID — text-only interaction tiles ════════════════════ */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.7rem;
    padding: 1rem 1.25rem 0;
  }

  .tile {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 96px;
    padding: 1.4rem 0.85rem 1rem;
    background: var(--surface);
    border: 1px solid var(--bronze-dim);
    border-radius: 6px;
    overflow: visible;
    text-decoration: none;
    text-align: center;
    transition: border-color 0.18s, background 0.18s, transform 0.15s, box-shadow 0.18s;
  }
  .tile:hover, .tile:active {
    border-color: var(--bronze);
    background: var(--bronze-glow);
    transform: translateY(-2px);
    box-shadow: 0 10px 22px -16px rgba(0,0,0,0.95);
  }
  .tile:hover .tile-bar > span, .tile:active .tile-bar > span {
    box-shadow: 0 0 8px rgba(184,147,90,0.5);
  }

  /* Category sigil(s) breaking the top edge — one small dot per cat,
     centered, instead of a full-width bar. Driven by each entry's cat(s). */
  .tile-bar {
    position: absolute;
    top: -7px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
  }
  .tile-bar > span {
    flex: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--surface);
    transition: box-shadow 0.18s;
  }

  .entry-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    line-height: 1.05;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--bronze);
  }
  /* The "+" reads as a separator between name lines, not part of a sentence */
  .plus {
    display: block;
    margin: 0.22rem 0;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    line-height: 1;
    color: var(--text-dim);
  }
  /* "VS" separator — for oppositional interactions (which beats which) */
  .vs {
    display: block;
    margin: 0.26rem 0;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.78rem;
    line-height: 1;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .visually-hidden {
    position: absolute !important;
    width: 1px; height: 1px;
    margin: -1px; padding: 0; border: 0;
    clip: rect(0 0 0 0); clip-path: inset(50%);
    overflow: hidden; white-space: nowrap;
  }


  /* ══ FOOTER — mirrors the homepage footer exactly ════════════════ */
  footer {
    text-align: center;
    padding: 0.85rem 1.5rem 0.5rem;
  }

  .footer-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.85rem;
    max-width: 400px;
    margin: 0 auto;
    padding: 0 1.25rem;
  }

  .footer-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    white-space: nowrap;
    background: var(--surface);
    border: 1px solid var(--bronze-dim);
    border-radius: var(--radius);
    padding: 0.6rem 0.5rem;
    color: var(--bronze);
    font-family: 'Barlow', sans-serif;
    font-weight: 600;
    font-size: 0.8rem;
    text-decoration: none;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }

  .footer-btn:hover {
    border-color: var(--bronze);
    color: var(--bronze);
    background: var(--bronze-glow);
  }

  .footer-btn svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
    flex-shrink: 0;
  }

  /* ── Quality floor: visible keyboard focus ── */
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--bronze);
    outline-offset: 2px;
  }
  .tile:focus-visible, .pin-tile:focus-visible { outline-offset: 3px; }

  /* ── Quality floor: respect reduced motion ── */
  .toast {
  position: fixed;
  left: 50%;
  bottom: calc(1.5rem + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(8px);
  background: var(--surface);
  border: 1px solid var(--bronze-dim);
  color: var(--white);
  font-family: 'Barlow', sans-serif;
  font-size: 0.9rem;
  padding: 0.6rem 1rem;
  border-radius: 10px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
    .tile:hover, .tile:active,
    .pin-tile:hover, .pin-tile:active,
    .suggest-btn:hover { transform: none; }
  }

  /* ── DESKTOP ── */
  @media (min-width: 640px) {
    .tk-header { padding: 0.25rem 2rem 0; }
    .footer-buttons { max-width: 380px; gap: 1rem; }
  }

  /* ── DESKTOP SCALE-UP — everything below the title/tagline gets bigger.
       Nav ring and footer buttons are untouched (own rules above). ── */
  @media (min-width: 900px) {
    .page { max-width: 900px; }

    .pinned { margin-top: 4rem; padding: 0 2.5rem 0.2rem; }

    /* Stack card physically overlaps the phase row below it (offset
       playing-card stack): negative margin pulls the phase row up
       under the Stack card, z-index keeps Stack on top, and each
       phase tile shifts sideways so its medallion clears the Stack
       card's edges instead of hiding underneath it. */
    .pin-stack-row { margin-top: 3.2rem; position: relative; z-index: 2; }
    .pin-anchor {
      max-width: 330px;
      padding: 3.3rem 1.2rem 1.9rem;
      box-shadow: inset 0 1px 0 rgba(240,236,230,0.045), 0 14px 28px -12px rgba(0,0,0,0.7);
    }
    .pin-phase-row { max-width: 640px; margin: 1rem auto 0; gap: 1.1rem; position: relative; z-index: 1; }
    .pin-phase-row .pin-tile { padding: 2.7rem 1.1rem 1.5rem; }
    .pin-phase-row .pin-tile:first-child { left: -48px; }
    .pin-phase-row .pin-tile:last-child { left: 48px; }
    .pin-anchor .pin-icon { width: 5.4rem; height: 5.4rem; transform: translate(-50%, -62%); }
    .pin-anchor .pin-icon svg { width: 38px; height: 38px; }
    .pin-anchor .pin-icon img { height: 42px; }
    .pin-phase-row .pin-icon { width: 4.3rem; height: 4.3rem; transform: translate(-50%, -60%); }
    .pin-phase-row .pin-icon svg { width: 30px; height: 30px; }
    .pin-phase-row .pin-icon img { height: 33px; }
    .pin-anchor .pin-label { font-size: 2.05rem; }
    .pin-phase-row .pin-label { font-size: 1.62rem; }

    .controls { padding: 1.15rem 2.5rem 1rem; }
    #search { font-size: 1.05rem; padding: 0.9rem 3rem 0.9rem 3.2rem; border-radius: 14px; }
    .search-icon { width: 22px; height: 22px; left: 18px; }
    .clear-btn { width: 34px; height: 34px; }
    .filters { gap: 0.55rem; margin-top: 0.85rem; }
    .filter-chip { font-size: 0.9rem; padding: 0.4rem 1rem; }
    .suggest-panel { padding: 1.2rem 1.4rem; }
    .suggest-panel p { font-size: 1.05rem; }
    .suggest-btn { font-size: 1.1rem; padding: 0.65rem 1.3rem; }

    .grid { grid-template-columns: repeat(3, 1fr); gap: 1rem; padding: 1.4rem 2.5rem 0; }
    .tile { min-height: 130px; padding: 1.8rem 1.1rem 1.4rem; }
    .tile-bar { top: -8px; gap: 5px; }
    .tile-bar > span { width: 16px; height: 16px; }
    .entry-name { font-size: 1.3rem; }
    .plus { font-size: 1rem; margin: 0.3rem 0; }
    .vs { font-size: 0.95rem; }
    .empty-note { font-size: 1.05rem; }
  }
</style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════════════
     EDIT HERE — the interaction list. Add one object per entry.
       names : every card / keyword in the interaction (drives search
               + shown on the tile, separated by a "+")
       slug  : the entry's page, linked as  /stack/<slug>
═════════════════════════════════════════════════════════════════════ -->
<script>
const ENTRIES = [
  {
    names: ["Protection"],
    slug: "protection",
    cat: "targeting"
  },
  {
    names: ["Ward"],
    slug: "ward",
    cat: "targeting"
  },
  {
    names: ["Hexproof/Shroud", "Nontargeting"],
    slug: "hexproof-shroud-nontargeting",
    sep: "vs",
    cat: "targeting"
  },
  {
    names: ["Indestructible", "-X/-X"],
    slug: "indestructible-minus-toughness",
    sep: "vs",
    cat: "sba"
  },
  {
    names: ["Trample", "Deathtouch"],
    slug: "trample-deathtouch",
    cat: "combat"
  },
  {
    names: ["When a Player Leaves"],
    slug: "losing-player-permanents",
    cat: "multiplayer"
  }
];

// Category metadata — drives the filter chips and the tile top-bar colors.
//   chip  : label shown in the filter row (also used for the tile's a11y label)
//   color : the chip fill + top-bar segment color
// Chip order below is the order they appear in the filter row.
// An entry's `cat` may be a single string ("combat") or an array
// (["combat","timing"]); arrays paint one bar segment per category,
// left to right, with the first listed as the primary. Cap at three.
const CATS = {
  combat:      { chip: "Combat",      color: "#e06060" },

<script>
(function () {
  const grid        = document.getElementById('grid');
  const searchInput = document.getElementById('search');
  const clearBtn    = document.getElementById('clearBtn');
  const suggestPanel= document.getElementById('suggestPanel');
  const suggestLink = document.getElementById('suggestLink');
  const noMatchQ    = document.getElementById('noMatchQ');
  const emptyNote   = document.getElementById('emptyNote');
  const statusEl    = document.getElementById('status');
  const filtersEl   = document.getElementById('filters');

  suggestLink.href = SUBMISSION_URL;

  // ── Category filtering ─────────────────────────────────────────
  let activeCat = 'all';

  // An entry's category can be a string or an array; normalize to an array.
  const catList = e => Array.isArray(e.cat) ? e.cat : (e.cat ? [e.cat] : []);

  // Build the chip row from CATS (single source of truth with the bars).
  function buildFilters() {
    const chips = [['all', 'All', null]].concat(
      Object.keys(CATS).map(k => [k, CATS[k].chip, CATS[k].color])
    );
    filtersEl.innerHTML = chips.map(([id, label, color]) =>
      '<button class="filter-chip' + (id === activeCat ? ' active' : '') + '"' +
      ' type="button" data-cat="' + id + '"' +
      ' aria-pressed="' + (id === activeCat ? 'true' : 'false') + '"' +
      (color ? ' style="--chip:' + color + '"' : '') + '>' +
      esc(label) + '</button>'
    ).join('');
  }

  filtersEl.addEventListener('click', e => {
    const chip = e.target.closest('.filter-chip');
    if (!chip) return;
    activeCat = chip.dataset.cat;
    buildFilters();
    render();
    if (typeof gtag === 'function') {
      gtag('event', 'click_filter', { 'event_category': 'filter', 'item_name': activeCat });
    }
  });

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => (
      { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
    ));
  }

  // ── Fuzzy scoring (verbatim from cardex.html) ──────────────────
  // Returns a score (higher = better) or -1 for "no match".
  // Substring hits always rank above looser subsequence hits.
  function score(query, text) {
    const q = query.toLowerCase().trim();
    const t = text.toLowerCase();
    if (!q) return 0;

    const idx = t.indexOf(q);
    if (idx !== -1) {
      let s = 1000 - idx * 2 - (t.length - q.length) * 0.5;
      if (idx === 0) s += 60;                                  // matches from the start
      else if (/\s/.test(t[idx - 1])) s += 30;                 // matches a word start
      return s;
    }

    // Subsequence: every query char must appear in order.
    let ti = 0, s = 0, prev = -1;
    for (let qi = 0; qi < q.length; qi++) {
      const c = q[qi];
      let found = -1;
      for (let k = ti; k < t.length; k++) { if (t[k] === c) { found = k; break; } }
      if (found === -1) return -1;
      if (prev !== -1) {
        const gap = found - prev - 1;
        s -= gap;                 // farther apart = weaker
        if (gap === 0) s += 6;    // adjacent = stronger
      }
      if (found === 0 || /\s/.test(t[found - 1] || '')) s += 8; // landed on a word start
      prev = found; ti = found + 1;
    }
    return 200 + s - t.length * 0.3; // capped below any substring score
  }

  // ── Build the filtered, sorted list ────────────────────────────
  // Search target = every name in the entry, concatenated.
  function compute() {
    const raw = searchInput.value;
    const q = raw.trim();

    let list = ENTRIES.map((e, i) => ({ e, i, s: score(raw, e.names.join(' ')) }));
    if (q !== '') list = list.filter(o => o.s >= 0);
    if (activeCat !== 'all') list = list.filter(o => catList(o.e).includes(activeCat));

    list.sort((a, b) => q !== '' ? (b.s - a.s || a.i - b.i) : (a.i - b.i));
    return { list, q };
  }

  // ── Render ─────────────────────────────────────────────────────
  function render() {
    const { list, q } = compute();

    grid.innerHTML = list.map(({ e }) => {
      const href  = '/stack/' + e.slug;                 // entry pages live under /stack/
      // sep: "vs" = oppositional interaction (which beats which); default = combo ("+")
      const isVs  = e.sep === 'vs';
      const sepWord = isVs ? 'vs' : 'plus';             // spoken form for the aria-label
      const sepCls  = isVs ? 'vs'  : 'plus';            // visible marker class
      const sepSym  = isVs ? 'vs'  : '+';               // visible marker text (.vs upper-cases it)
      const label = e.names.join(' ' + sepWord + ' ') + ' — view interaction';
      const inner = e.names.map((n, i) =>
        (i > 0 ? '<span class="' + sepCls + '" aria-hidden="true">' + sepSym + '</span>' : '') +
        '<span class="entry-name">' + esc(n) + '</span>'
      ).join('');
      const cats = catList(e);
      const bar = cats.length
        ? '<span class="tile-bar" aria-hidden="true">' +
            cats.map(k => '<span style="background:' +
              (CATS[k] ? CATS[k].color : 'var(--bronze)') + '"></span>').join('') +
          '</span>'
        : '';
      const catNames = cats.map(k => CATS[k] ? CATS[k].chip : k).join(', ');
      const aria = label + (catNames ? '. Category: ' + catNames : '');
      return '<a class="tile" href="' + esc(href) + '" aria-label="' + esc(aria) + '">' + bar + inner + '</a>';
    }).join('');

    // No-match panel: a non-empty search that turned up nothing.
    const noResults = list.length === 0;
    const showSuggest = noResults && q !== '';
    suggestPanel.hidden = !showSuggest;
    if (showSuggest) noMatchQ.textContent = q;

    // Empty grid with no active search (no entries in this view yet).
    const emptyNoQuery = noResults && q === '';
    emptyNote.hidden = !emptyNoQuery;
    if (emptyNoQuery) {
      emptyNote.textContent = activeCat === 'all'
        ? 'No interactions here yet.'
        : 'Nothing in this category yet.';
    }

    // A11y: announce the result count.
    statusEl.textContent = list.length + (list.length === 1 ? ' interaction' : ' interactions');
  }

  // ── Wiring ─────────────────────────────────────────────────────
  searchInput.addEventListener('input', () => {
    clearBtn.hidden = searchInput.value === '';
    render();
  });

  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearBtn.hidden = true;
    searchInput.focus();
    render();
  });

  // Esc clears the field while it's focused.
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Escape' && searchInput.value !== '') {
      e.preventDefault();
      searchInput.value = '';
      clearBtn.hidden = true;
      render();
    }
  });

// ── Google Analytics Button Tracking ─────────────────────────────
  document.addEventListener('click', function(e) {
    if (typeof gtag !== 'function') return;

    // 1. Pinned Quick Reference Clicks
    const pinTile = e.target.closest('.pin-tile');
    if (pinTile) {
      const label = pinTile.querySelector('.pin-label').innerText.replace(/\n/g, ' ');
      gtag('event', 'click_pinned_tile', { 
        'event_category': 'quick_reference', 
        'item_name': label 
      });
    }

    // 2. Search Result Clicks (Dynamically generated)
    const searchTile = e.target.closest('.tile');
    if (searchTile) {
      const label = searchTile.getAttribute('aria-label');
      gtag('event', 'click_interaction_result', { 
        'event_category': 'search', 
        'item_name': label,
        'search_term': searchInput.value 
      });
    }

    // 3. Footer Links (Ko-fi & Insta)
    const footerBtn = e.target.closest('.footer-btn');
    if (footerBtn) {
      const link = footerBtn.getAttribute('href');
      gtag('event', 'click_outbound_footer', { 
        'event_category': 'engagement', 
        'link_url': link 
      });
    }

    // 4. Suggestion Button
    const suggestBtn = e.target.closest('#suggestLink');
    if (suggestBtn) {
      gtag('event', 'click_suggest_interaction', { 
        'event_category': 'feedback' 
      });
    }
    
    // 5. Logo / Home Clicks
    const homeBtn = e.target.closest('.logo-home');
    if (homeBtn) {
      gtag('event', 'click_home_logo', { 
        'event_category': 'navigation' 
      });
    }
  });
  
  buildFilters();
  render();
})();
</script>

<script>
(function () {
  var btn = document.getElementById('shareBtn');
  if (!btn) return;

  // Zero per-page config: both read at runtime.
  var canonical = document.querySelector('link[rel="canonical"]');
  var url = (canonical && canonical.href) ? canonical.href : location.href;
  var raw = document.title || '';
  var title = raw.replace(/\s*[—·|-]\s*MTJawnny\s*$/i, '').trim() || raw;

  function showToast(msg) {
    var t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  function legacyCopy() {
    try {
      var ta = document.createElement('textarea');
      ta.value = url;
      ta.setAttribute('readonly', '');
      ta.style.position = 'absolute';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Link copied');
    } catch (e) {
      showToast('Copy not supported');
    }
  }

  btn.addEventListener('click', function () {
    if (navigator.share) {
      navigator.share({ title: title, url: url }).catch(function () {});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url)
        .then(function () { showToast('Link copied'); })
        .catch(function () { legacyCopy(); });
    } else {
      legacyCopy();
    }
  });
})();
</script>
