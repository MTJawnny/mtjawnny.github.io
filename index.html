  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@400;600;700;800;900&display=swap');

    :root {
      --bg:        #1e1728;
      --surface:   #261d33;
      --bronze:    #b8935a;
      --bronze-dim:#7a5e35;
      --bronze-glow: rgba(184,147,90,0.15);
      --text:      #e8e0f0;
      --text-dim:  #9b8fb0;
      --radius:    10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    header {
      text-align: center;
      padding: 0.25rem 1.5rem 0;
    }

    .logo-wrap {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 0.3rem;
    }

    .logo-pip-ring {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }

    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(2.4rem, 14vw, 3.6rem);
      letter-spacing: 0.04em;
      color: var(--bronze);
      line-height: 1;
      text-transform: uppercase;
    }

    .tagline {
      font-size: 0.95rem;
      color: var(--text-dim);
      margin-top: 0.1rem;
      letter-spacing: 0.01em;
    }

    /* ── NAV GRID ── */
    .nav-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      max-width: 480px;
      margin: 0.85rem auto 0;
      padding: 0 1.25rem;
    }

    .nav-tile {
      background: var(--surface);
      border: 1px solid var(--bronze-dim);
      border-radius: var(--radius);
      padding: 1.4rem 1rem 1.2rem;
      text-align: center;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .nav-tile::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--bronze-glow);
      opacity: 0;
      transition: opacity 0.2s;
      border-radius: var(--radius);
    }

    .nav-tile:hover {
      border-color: var(--bronze);
      transform: translateY(-2px);
    }

    .nav-tile:hover::after {
      opacity: 1;
    }

    .nav-tile .tile-icon {
      color: var(--bronze);
      line-height: 1;
    }

    .nav-tile .tile-icon img {
      height: 38px;
      width: auto;
      display: block;
    }

    .btn-icon {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      transform: translateY(1.5px);
    }

    .nav-tile .tile-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--bronze);
    }

    .nav-tile .tile-desc {
      font-size: 0.75rem;
      color: var(--text-dim);
      line-height: 1.35;
    }

    .asset-tile .tile-icon img {
      height: 42px;
    }

    /* ── ASSET TILE ── */
    .asset-tile {
      width: 213px;
      margin: 0.85rem auto 0;
      min-height: 0;
    }

    /* ── DISCORD ── */
    .discord-section {
      max-width: 440px;
      margin: 0.85rem auto 0;
      padding: 0 1.25rem;
    }

    .discord-btn {
      flex-direction: column;
      gap: 0.5rem;
      width: 213px;
      max-width: 100%;
      padding: 1rem;
    }

    .discord-line2 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .big-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      line-height: 1;
      background: var(--surface);
      border: 1px solid var(--bronze-dim);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      max-width: 88%;
      margin-left: auto;
      margin-right: auto;
      color: var(--bronze);
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
      cursor: pointer;
    }

    .big-btn:hover {
      background: var(--bronze-glow);
      border-color: var(--bronze);
    }

    .big-btn + .big-btn {
      margin-top: 0.75rem;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 0.85rem 1.5rem 1.5rem;
    }

    .footer-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      max-width: 400px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    .footer-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      white-space: nowrap;
      background: var(--surface);
      border: 1px solid var(--bronze-dim);
      border-radius: var(--radius);
      padding: 0.6rem 0.5rem;
      color: var(--bronze);
      font-family: 'Barlow', sans-serif;
      font-weight: 600;
      font-size: 0.8rem;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .footer-btn:hover {
      border-color: var(--bronze);
      color: var(--bronze);
      background: var(--bronze-glow);
    }

    .footer-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* ── DESKTOP ── */
    @media (min-width: 640px) {
      header { padding: 0.25rem 2rem 0; }
      .nav-grid { max-width: 560px; gap: 1rem; }
      .nav-tile { padding: 1.75rem 1.25rem 1.5rem; }
      .nav-tile .tile-label { font-size: 1.2rem; }
      .nav-tile .tile-desc { font-size: 0.8rem; }
      .asset-tile { width: 252px; margin-top: 1rem; }
      .discord-btn { width: 252px; }
      .discord-section { max-width: 510px; }
      .footer-buttons { max-width: 380px; gap: 1rem; }
    }
  </style>
