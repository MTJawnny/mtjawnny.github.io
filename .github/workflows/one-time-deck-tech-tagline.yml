name: Apply Deck Tech tagline refinement

on:
  push:
    branches:
      - site/personality-consistency-2026-10-06

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/personality-consistency-2026-10-06
          fetch-depth: 0

      - name: Apply exact tagline refinement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changes = {
              Path('tools/index.html'): (
                  'Research, proxy, print. Free browser & desktop tools!',
                  'Research, proxy, print. Free browser tools & desktop apps!',
              ),
              Path('docs/site/NAMING-COPY-CONSISTENCY-PASS-2026-10-06.md'): (
                  'Research, proxy, print. Free browser & desktop tools!',
                  'Research, proxy, print. Free browser tools & desktop apps!',
              ),
          }

          for path, (old, new) in changes.items():
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one old tagline, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          grep -Fq 'Research, proxy, print. Free browser tools & desktop apps!' tools/index.html
          grep -Fq 'Research, proxy, print. Free browser tools & desktop apps!' docs/site/NAMING-COPY-CONSISTENCY-PASS-2026-10-06.md
          git diff --check

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/one-time-deck-tech-tagline.yml
          git config user.name 'MTJawnny'
          git config user.email 'mtjawnny@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'site: refine Deck Tech tagline terminology'
          git push origin HEAD:site/personality-consistency-2026-10-06
